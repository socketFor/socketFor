baseURL = 'https://socketFor.github.io/my-blog/'
defaultContentLanguage = 'zh'
locale = 'zh-CN'
hasCJKLanguage = true
title = 'Socket Blog'
theme = 'PaperMod'

enableRobotsTXT = true
paginate = 5
ignoreLogs = ['warning-goldmark-raw-html']

[params]
  defaultTheme = "auto"
  description = "Socket 的个人博客 - 技术、编程与思考"
  keywords = ["blog", "技术", "编程", "软件工程", "中文博客"]
  ShowWordCount = true

  [params.profileMode]
    enabled = true
    title = "你好，我是 Socket 👋"
    subtitle = "路漫漫其修远兮，吾将上下而求索。"
    imageUrl = "head.jpg"
    imageWidth = 120
    imageHeight = 120


  socialIcons = [
    { name = "github", url = "https://github.com/socketFor" },
  ]

  ShowReadingTime = true
  ShowShareButtons = false
  ShowToc = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowLastMod = false

[[menu.main]]
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  name = "标签"
  url = "/tags/"
  weight = 20

[[menu.main]]
  name = "归档"
  url = "/archives/"
  weight = 30

[markup]
  [markup.highlight]
    style = "monokai"
    noClasses = false
