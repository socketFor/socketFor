baseURL = 'https://socketFor.github.io/my-blog/'
defaultContentLanguage = 'zh'
locale = 'zh-CN'
hasCJKLanguage = true
title = 'Socket Blog'
theme = 'PaperMod'

enableRobotsTXT = true
ignoreLogs = ['warning-goldmark-raw-html']


[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "JSON", "RSS"]

[params]
  defaultTheme = "auto"
  description = "Socket 的个人博客 - 技术、编程与思考"
  keywords = ["blog", "技术", "编程", "软件工程", "中文博客"]
  ShowWordCount = true

  [params.profileMode]
    enabled = true
    title = "你好，我是 Socket 👋"
    subtitle = "路漫漫其修远兮，吾将上下而求索。"
    imageUrl = "head.jpg"
    imageWidth = 120
    imageHeight = 120


  socialIcons = [
    { name = "github", url = "https://github.com/socketFor" },
  ]

  ShowReadingTime = true
  ShowShareButtons = false
  ShowToc = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowLastMod = false

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    threshold = 0.3
    distance = 1000
    ignoreLocation = true
    minMatchCharLength = 1
    keys = ["title", "content", "summary", "permalink"]

[[menu.main]]
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  name = "标签"
  url = "/tags/"
  weight = 20

[[menu.main]]
  name = "归档"
  url = "/archives/"
  weight = 30

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 40

[markup]
  [markup.highlight]
    style = "monokai"
    noClasses = false
